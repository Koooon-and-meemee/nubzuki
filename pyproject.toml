[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nubzuki"
dynamic = ["version"]
description = "Sweep KAIST KLMS and the KAIST portal for new posts, deadlines, files and grades, and set up per-semester course folders"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
browser = ["browser_cookie3"]

[project.scripts]
nubzuki = "nubzuki.cli:main"

[tool.setuptools]
packages = ["nubzuki"]

[tool.setuptools.dynamic]
version = { attr = "nubzuki.__version__" }
