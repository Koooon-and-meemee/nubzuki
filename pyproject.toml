[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nubzuki"
dynamic = ["version"]
description = "KAIST KLMS 새 소식 스윕 + 학기 폴더 자동 정리 CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
browser = ["browser_cookie3"]

[project.scripts]
nubzuki = "nubzuki.cli:main"

[tool.setuptools]
packages = ["nubzuki"]

[tool.setuptools.dynamic]
version = { attr = "nubzuki.__version__" }
