<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="Asking what assignments are due today, with a phone login">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif;font-size:15px;fill:#1F2328}
.card{fill:#F6F7F9} .rule{stroke:#E4E7EB}
.title{font-weight:600;font-size:16px} .muted{fill:#656D76;font-size:13.5px}
.strong{font-weight:650} .ububble{fill:#E6E9EE} .abubble{fill:#FFFFFF}
.chiptxt{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'D2Coding', monospace;font-size:13px;fill:#6E7781}
.chipk{fill:#8C959F} .chipw{fill:#BF8700;font-weight:700} .chipn{fill:#656D76}
.brand{fill:#0B3D91} .brandtxt{fill:#FFFFFF;font-weight:800;font-size:12px}
.numbox{fill:#0B3D91} .num{fill:#FFFFFF;font-size:40px;font-weight:800;letter-spacing:4px}
.dot{fill:#0B3D91} .warn{fill:#FFF8C5;stroke:#D4A72C} .warntxt{fill:#6B4F00;font-size:14px}
.done{fill:#1A7F37} .due{fill:#CF222E;font-weight:650}
@media (prefers-color-scheme: dark){
text{fill:#E6EDF3} .card{fill:#161B22} .rule{stroke:#21262D}
.muted{fill:#8D96A0} .ububble{fill:#262C36} .abubble{fill:#0D1117}
.chiptxt{fill:#8B949E} .chipk{fill:#6E7681} .chipw{fill:#D29922} .chipn{fill:#8D96A0}
.brand{fill:#DCE7FF} .brandtxt{fill:#0B3D91} .numbox{fill:#DCE7FF} .num{fill:#0B3D91}
.dot{fill:#9DB8F2} .warn{fill:#2B2111;stroke:#9E6A03} .warntxt{fill:#E3B341}
.done{fill:#3FB950} .due{fill:#FF7B72}
}
</style>
<rect x="0" y="0" width="760" height="640" rx="10" class="card"/>
<line x1="0" y1="52" x2="760" y2="52" class="rule"/>
<text x="28" y="31" class="title">Claude</text>
<text x="736" y="31" class="muted" text-anchor="end">nubzuki MCP</text>
<rect x="227" y="60" width="505" height="40" rx="20" class="ububble"/>
<text x="245" y="85" class="" text-anchor="start">넙죽이한테 물어봐서 오늘 마무리 해야하는 과제 있는지 알려줘</text>
<text x="28" y="134" class="chiptxt"><tspan class="chipw">⏺</tspan><tspan dx="8">nubzuki · sweep</tspan><tspan class="chipn" dx="14">No live KLMS session</tspan></text>
<text x="28" y="158" class="chiptxt"><tspan class="chipk">⏺</tspan><tspan dx="8">nubzuki · login</tspan><tspan class="chipn" dx="14">number: 47</tspan></text>
<rect x="28" y="176" width="664" height="132" rx="16" class="abubble"/>
<text x="44" y="202" class="" text-anchor="start">KLMS 세션이 만료돼서 휴대폰으로 로그인 요청을 보냈어요. KAIST 앱에서 이 숫자를 눌러주세요.</text>
<rect x="44" y="224" width="112" height="64" rx="12" class="numbox"/>
<text x="100" y="270" class="num" text-anchor="middle">47</text>
<text x="172" y="252" class="muted" text-anchor="start">KAIST 앱 → 인증 요청 → 47 탭</text>
<text x="172" y="274" class="muted" text-anchor="start">비밀번호는 보내지도 저장하지도 않아요</text>
<text x="28" y="328" class="chiptxt"><tspan class="chipk">⏺</tspan><tspan dx="8">nubzuki · login_status</tspan><tspan class="chipn" dx="14">logged_in</tspan></text>
<text x="28" y="352" class="chiptxt"><tspan class="chipk">⏺</tspan><tspan dx="8">nubzuki · sweep</tspan><tspan class="chipn" dx="14">2 deadlines · 1 post</tspan></text>
<text x="28" y="376" class="chiptxt"><tspan class="chipk">⏺</tspan><tspan dx="8">nubzuki · read_post</tspan><tspan class="chipn" dx="14">HSS.20117 Q&amp;A</tspan></text>
<rect x="28" y="394" width="664" height="226" rx="16" class="abubble"/>
<text x="44" y="420" class="" text-anchor="start"><tspan class="strong">오늘(10/28 수) 마감</tspan></text>
<circle cx="50" cy="443" r="3" class="dot"/>
<text x="62" y="448" class="" text-anchor="start"><tspan class="strong">스타트업 101</tspan>  중간발표 과제물 제출 · <tspan class="due">23:59</tspan> · 아직 제출 안 됨</text>
<circle cx="50" cy="471" r="3" class="dot"/>
<text x="62" y="476" class="" text-anchor="start"><tspan class="strong">일반화학 II</tspan>  9주차 온라인 퀴즈 · <tspan class="due">18:00</tspan> · 10문항, 1회 응시</text>
<text x="44" y="508" class="" text-anchor="start"><tspan class="strong">참고</tspan></text>
<circle cx="50" cy="531" r="3" class="dot"/>
<text x="62" y="536" class="" text-anchor="start">Q&amp;A 답변: 발표 자료는 PDF로, 10분 이내. 조원 중 한 명만 제출하면 돼요.</text>
<circle cx="50" cy="559" r="3" class="dot"/>
<text x="62" y="564" class="" text-anchor="start">미적분학Ⅱ 과제 8은 이미 제출돼 있어요.</text>
<text x="44" y="596" class="strong" text-anchor="start">퀴즈가 먼저라 18시 전에 일반화학부터 하시면 될 것 같아요.</text>
</svg>
