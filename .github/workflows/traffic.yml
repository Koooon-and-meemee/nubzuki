name: traffic

# GitHub keeps traffic for 14 days. This archives it daily to the `traffic` branch (README.md there is the summary).
# Needs a repo secret TRAFFIC_TOKEN: a fine-grained token for this repo with "Administration: Read-only".

on:
  schedule:
    - cron: "17 23 * * *"   # 08:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency: traffic

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.token.outputs.ok }}
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::TRAFFIC_TOKEN is not set, skipping"; fi
  archive:
    needs: check
    if: needs.check.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Check out the traffic branch
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "$URL" traffic >/dev/null; then
            git clone --depth 1 --branch traffic "$URL" data
          else
            git init -b traffic data && git -C data remote add origin "$URL"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python main/.github/scripts/traffic.py data
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
      - name: Commit
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "traffic $(date -u +%F)"
          git push -q origin traffic
